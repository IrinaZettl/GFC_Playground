[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gfm_lab"
version = "0.1.0"
description = "Helper functions for my notebook"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "logging",
    "andes"
    "matplotlib.pyplot"
]

[tool.setuptools]
py-modules = ["gfm_lab"]
