[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gfm-lab"
version = "0.1.0"
description = "Helper module for the ANDES lab 'Grid-following vs. grid-forming inverters'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "andes==2.0.0",
    "ipywidgets>=7.7",   # >=7.7 so the preinstalled version on Google Colab is kept
    "matplotlib",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
local = ["jupyterlab", "ipykernel"]

[tool.setuptools]
py-modules = ["gfm_lab"]
